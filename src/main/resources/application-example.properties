# Copy this file to application.properties (same folder) and set your MySQL password.
# application.properties is git-ignored, so your password is never pushed.

spring.application.name=sales-stock-management
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/sales_stock_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=YOUR_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Dev only: show error messages / stack trace in error responses
server.error.include-message=always
server.error.include-stacktrace=on_param

# Set to true once to add 10 sample products (existing names are skipped)
app.seed-sample-data=false
